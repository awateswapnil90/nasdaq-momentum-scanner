name: Update scanner data

on:
  schedule:
    # 22:15 UTC Mon–Fri = 3:45 AM IST Tue–Sat, after the US close (also covers winter time)
    - cron: "15 22 * * 1-5"
  workflow_dispatch: {}        # "Run workflow" button (works from the GitHub phone app)
  push:
    branches: [main]
    paths: ["index.html", ".github/workflows/update.yml"]   # redeploy when the page changes

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Download prices and quarterly results
        if: github.event_name != 'push'
        run: python download_data.py --top 500

      - name: Reuse the live data (page-only change)
        if: github.event_name == 'push'
        run: |
          curl -sfL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/scanner_data.js" -o scanner_data.js \
            || python download_data.py --top 500

      - name: Save data to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add fundamentals_cache.json universe_cache.csv
          git diff --cached --quiet || git commit -m "Data update $(date -u +%Y-%m-%d)"
          git push

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html scanner_data.js _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
